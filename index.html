<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Taddla — Verified Consumer Reviews, Ratings & Product Insights</title>
    <meta name="title" content="Taddla — Verified Consumer Reviews, Ratings & Product Insights" />
    <meta name="description" content="Discover authentic consumer reviews, AI-powered review summaries, long-term product experience timelines, and verified buyer ratings on Taddla." />
    <meta name="keywords" content="Taddla, consumer reviews, product ratings, verified purchase reviews, AI review summary, authentic product reviews, service reviews, long term experience reviews" />
    <meta name="author" content="Taddla" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taddla" />
    <meta property="og:url" content="https://taddla.com/" />
    <meta property="og:title" content="Taddla — Verified Consumer Reviews & Authentic Product Ratings" />
    <meta property="og:description" content="Read 100% authentic consumer reviews, AI review summaries, and long-term experience timelines for global products and services." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&q=80&w=1200" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://taddla.com/" />
    <meta property="twitter:title" content="Taddla — Verified Consumer Reviews & Authentic Product Ratings" />
    <meta property="twitter:description" content="Read 100% authentic consumer reviews, AI review summaries, and long-term experience timelines for global products and services." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&q=80&w=1200" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://taddla.com/" />

    <!-- Schema.org Structured Data (JSON-LD) for WebSite & Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Taddla",
        "alternateName": "Taddla Consumer Reviews",
        "url": "https://taddla.com/",
        "description": "Global product and service review platform featuring AI review summaries, photo recognition, long-term experience timelines, and authenticity scores.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://taddla.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Taddla",
        "url": "https://taddla.com/",
        "logo": "https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&q=80&w=500",
        "sameAs": [
          "https://twitter.com/taddla_reviews",
          "https://facebook.com/taddla"
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    
  </body>
</html>
